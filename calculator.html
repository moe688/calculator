<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=backspace"
    />
    <title>Document</title>
  </head>
  <body class="calculator-body">
    <div class="status-bar flex flex-row">
      <p class="time">9:37</p>
      <img class="notch" src="assets/Notch.svg" />
      <div class="icons flex flex-row">
        <img src="assets/Mobile-signal.svg" alt="" />
        <img src="assets/Wifi.svg" alt="" />
        <img src="assets/Battery.svg" alt="" />
      </div>
    </div>
    <div class="theme flex flex-row">
      <label class="switch">
        <input type="checkbox" />
        <span class="slider round"></span>
      </label>
    </div>
    <div class="calculator flex flex-column">
      <h2 class="equation">5x5</h2>
      <h1 class="result">25</h1>
      <div class="buttons flex flex-column">
        <div class="flex key-row">
          <button class="key medium-emphasis">C</button>
          <button class="key medium-emphasis">±</button>
          <button class="key medium-emphasis">%</button>
          <button class="key high-emphasis">÷</button>
        </div>
        <div class="flex key-row">
          <button class="key low-emphasis">7</button>
          <button class="key low-emphasis">8</button>
          <button class="key low-emphasis">9</button>
          <button class="key high-emphasis">x</button>
        </div>
        <div class="flex key-row">
          <button class="key low-emphasis">4</button>
          <button class="key low-emphasis">5</button>
          <button class="key low-emphasis">6</button>
          <button class="key high-emphasis">-</button>
        </div>
        <div class="flex key-row">
          <button class="key low-emphasis">1</button>
          <button class="key low-emphasis">2</button>
          <button class="key low-emphasis">3</button>
          <button class="key high-emphasis">+</button>
        </div>
        <div class="flex key-row">
          <button class="key low-emphasis">.</button>
          <button class="key low-emphasis">0</button>
          <button class="key low-emphasis">
            <span class="material-symbols-outlined"> backspace </span>
          </button>
          <button class="key high-emphasis">=</button>
        </div>
      </div>
    </div>
    <div class="home-indicator flex">
      <div class="white-line flex"></div>
    </div>
  </body>
</html>
